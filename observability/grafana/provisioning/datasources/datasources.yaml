apiVersion: 1
datasources:
  - name: Sudoku Prometheus
    uid: sudoku-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: sudoku-tempo
  - name: Sudoku Loki
    uid: sudoku-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Trace ID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: sudoku-tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
  - name: Sudoku Tempo
    uid: sudoku-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: sudoku-loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
        customQuery: false
