name: Bounded Sudoku alert repair

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: Opaque, receiver-generated incident identifier
        required: true
        type: string
      expires_at:
        description: Receiver-issued UTC incident expiry
        required: true
        type: string

permissions:
  contents: read

env:
  DEMO_CONTROL_REQUIRED: "true"
  ALERT_REPAIR_AUTH_URL: ${{ vars.ALERT_REPAIR_AUTH_URL }}

concurrency:
  group: sudoku-alert-repair-main
  cancel-in-progress: false

jobs:
  authorization:
    outputs:
      run_id: ${{ steps.claim.outputs.run_id }}
      run_attempt: ${{ steps.claim.outputs.run_attempt }}
      incident_id: ${{ steps.claim.outputs.incident_id }}
      expires_at: ${{ steps.claim.outputs.expires_at }}
      branch: ${{ steps.claim.outputs.branch }}
      trusted_revision: ${{ steps.claim.outputs.trusted_revision }}
      fault_revision: ${{ steps.claim.outputs.fault_revision }}
      expected_repaired_tree: ${{ steps.claim.outputs.expected_repaired_tree }}
      backend_digest: ${{ steps.claim.outputs.backend_digest }}
      frontend_digest: ${{ steps.claim.outputs.frontend_digest }}
      rollback_backend_digest: ${{ steps.claim.outputs.rollback_backend_digest }}
      rollback_frontend_digest: ${{ steps.claim.outputs.rollback_frontend_digest }}
      backend_target: ${{ steps.claim.outputs.backend_target }}
      frontend_target: ${{ steps.claim.outputs.frontend_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Claim receiver-accepted incident before candidate execution
        id: claim
        env:
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_AUTH_URL: ${{ vars.ALERT_REPAIR_AUTH_URL }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py authorize
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"

  candidate:
    needs: authorization
    defaults:
      run:
        working-directory: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.trusted_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.fault_revision }}
          path: candidate
          persist-credentials: false
      - name: Build pinned isolated Copilot runtime from trusted tooling
        run: docker build -f scripts/repair-runtime.Dockerfile -t sudoku-repair-runtime:trusted .
      - name: Run existing coordinator in bounded candidate workspace
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
          ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
          ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
          ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
          ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
          ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
          ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py run
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
          --patch "$RUNNER_TEMP/candidate.patch"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sudoku-repair-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.patch
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [authorization, candidate]
    defaults:
      run:
        working-directory: tooling
    env:
      DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
      ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
      ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
      ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
      ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
      ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
      ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
      ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
      ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.trusted_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.fault_revision }}
          path: candidate
          persist-credentials: false
      - name: Verify the one-time receiver claim before patch validation
        env:
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
          ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
          ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
          ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
          ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
          ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
          ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py verify-authorization
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-repair-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-candidate
      - name: Validate and apply candidate patch
        run: >-
          python3 scripts/repair_runner.py apply-patch
          "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
      - name: Run trusted full suite on exact repaired candidate tree
        run: >-
          python3 scripts/repair_runner.py test-candidate
          --candidate-root "$GITHUB_WORKSPACE/candidate"
          --patch "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --output "$RUNNER_TEMP/test-receipt.json"
      - name: Build pinned isolated Copilot runtime for independent role reviews
        run: docker build -f scripts/repair-runtime.Dockerfile -t sudoku-repair-runtime:trusted .
      - name: Produce independent diff-bound QA and Reviewer evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
        run: |
          python3 scripts/repair_runner.py collect-reviews \
            --patch "$RUNNER_TEMP/repair-candidate/candidate.patch" \
            --fault-revision "$ALERT_REPAIR_AUTH_FAULT_REVISION" \
            --test-receipt "$RUNNER_TEMP/test-receipt.json" \
            --output "$RUNNER_TEMP/repair-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sudoku-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-evidence.json
          if-no-files-found: error
          retention-days: 1

  publish-pr:
    needs: [authorization, verify]
    defaults:
      run:
        working-directory: tooling
    env:
      DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
      ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
      ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
      ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
      ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
      ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
      ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
      ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
      ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
    if: >-
      github.repository == 'sadevaraj/aidevtools_prj' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.trusted_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Verify receiver authorization before publication credentials
        env:
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py verify-authorization
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-repair-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-candidate
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-evidence
      - name: Verify independent current-candidate evidence before PR credentials
        env:
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
        run: >-
          python3 scripts/repair_runner.py verify-evidence
          --patch "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --evidence "$RUNNER_TEMP/repair-evidence/repair-evidence.json"
          --fault-revision "$ALERT_REPAIR_AUTH_FAULT_REVISION"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.ALERT_REPAIR_PR_TOKEN }}
          ref: ${{ needs.authorization.outputs.branch }}
          path: publish
          persist-credentials: true
      - name: Publish only the validated and independently tested patch
        env:
          ALERT_REPAIR_PR_TOKEN: ${{ secrets.ALERT_REPAIR_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
          ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
          ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
          ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
          ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
          ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
          ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py publish-pr
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
          --patch "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --candidate-root "$GITHUB_WORKSPACE/publish"
          --evidence "$RUNNER_TEMP/repair-evidence/repair-evidence.json"
