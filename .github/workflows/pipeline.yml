name: Sudoku pipeline

on:
  pull_request:
  push:
    branches: [main, demo/save-recovery]

permissions:
  contents: read

# Do not cancel an in-flight paired deployment when a newer commit arrives.
concurrency:
  group: sudoku-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Unit, PostgreSQL, frontend build and proxy regressions
        run: sh scripts/test.sh

  publish:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      (github.ref == 'refs/heads/main' ||
      (github.ref == 'refs/heads/demo/save-recovery' && vars.DEMO_RECOVERY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.ref == 'refs/heads/demo/save-recovery'
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          path: trusted-tools
          persist-credentials: false
      - name: Require exact owner-authorized repaired demo tree
        if: github.ref == 'refs/heads/demo/save-recovery'
        env:
          DEMO_RECOVERY_ENABLED: ${{ vars.DEMO_RECOVERY_ENABLED }}
          DEMO_EXPECTED_REPAIRED_TREE: ${{ vars.DEMO_EXPECTED_REPAIRED_TREE }}
          DEMO_TRUSTED_REVISION: ${{ vars.DEMO_TRUSTED_REVISION }}
          DEMO_FAULT_REVISION: ${{ vars.DEMO_FAULT_REVISION }}
          DEMO_EXPIRES_AT: ${{ vars.DEMO_EXPIRES_AT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 "$GITHUB_WORKSPACE/trusted-tools/scripts/demo_control.py" verify-merge
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ghcr.io/sadevaraj/simple-sudoku-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sadevaraj/aidevtools_prj
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: frontend
          push: true
          tags: ghcr.io/sadevaraj/simple-sudoku-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sadevaraj/aidevtools_prj
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image pair (including partial publication)
        if: always()
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          RENDER_DEV_CD_ENABLED: ${{ vars.RENDER_DEV_CD_ENABLED }}
          RENDER_DEV_VERIFIED: ${{ vars.RENDER_DEV_VERIFIED }}
        run: python3 scripts/pipeline.py record-pair
      - name: Retain immutable image identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-pair-${{ github.sha }}
          path: image-pair.json
          if-no-files-found: error
          retention-days: 30

  deploy-development:
    needs: [tests, publish]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      vars.RENDER_DEV_CD_ENABLED == 'true' &&
      vars.RENDER_DEV_VERIFIED == 'true' &&
      ((github.ref == 'refs/heads/main') ||
      (github.ref == 'refs/heads/demo/save-recovery' && vars.DEMO_RECOVERY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: sudoku-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.ref == 'refs/heads/demo/save-recovery'
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          path: trusted-tools
          persist-credentials: false
      - name: Deploy exact published development pair
        env:
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
          RENDER_DEV_CD_ENABLED: ${{ vars.RENDER_DEV_CD_ENABLED }}
          RENDER_DEV_VERIFIED: ${{ vars.RENDER_DEV_VERIFIED }}
          RENDER_DEV_VERIFICATION_URL: ${{ vars.RENDER_DEV_VERIFICATION_URL }}
          DEMO_RECOVERY_ENABLED: ${{ vars.DEMO_RECOVERY_ENABLED }}
          DEMO_EXPECTED_REPAIRED_TREE: ${{ vars.DEMO_EXPECTED_REPAIRED_TREE }}
          DEMO_TRUSTED_REVISION: ${{ vars.DEMO_TRUSTED_REVISION }}
          DEMO_FAULT_REVISION: ${{ vars.DEMO_FAULT_REVISION }}
          DEMO_EXPIRES_AT: ${{ vars.DEMO_EXPIRES_AT }}
          RENDER_DEV_BACKEND_SERVICE_ID: ${{ vars.RENDER_DEV_BACKEND_SERVICE_ID }}
          RENDER_DEV_FRONTEND_SERVICE_ID: ${{ vars.RENDER_DEV_FRONTEND_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/demo/save-recovery ]; then
            python3 "$GITHUB_WORKSPACE/trusted-tools/scripts/pipeline.py" deploy
          else
            python3 scripts/pipeline.py deploy
          fi
      - name: Retain deployment result, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-development-${{ github.sha }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 30
