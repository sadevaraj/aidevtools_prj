name: Sudoku pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit owner fault deployment or receiver-authenticated repair
        required: true
        type: choice
        options: [fault, repair]
      incident_id:
        description: Opaque, receiver-generated incident identifier
        required: false
        type: string
      expires_at:
        description: Receiver-issued UTC incident expiry
        required: false
        type: string

permissions:
  contents: read

env:
  DEMO_CONTROL_REQUIRED: "true"
  ALERT_REPAIR_AUTH_URL: ${{ vars.ALERT_REPAIR_AUTH_URL }}
  PIPELINE_MODE: ${{ inputs.mode }}
  TRUSTED_REVISION: ${{ vars.DEMO_TRUSTED_REVISION }}
  FAULT_REVISION: ${{ github.sha }}
  DEMO_FAULT_ENABLED: ${{ vars.DEMO_FAULT_ENABLED }}
  DEMO_ROLLBACK_PAIR_VERIFIED: ${{ vars.DEMO_ROLLBACK_PAIR_VERIFIED }}
  DEMO_WINDOW_CONFIRMED: ${{ vars.DEMO_WINDOW_CONFIRMED }}
  DEMO_IMAGE_PROVENANCE_VERIFIED: ${{ vars.DEMO_IMAGE_PROVENANCE_VERIFIED }}
  DEMO_TARGETS_CONFIRMED: ${{ vars.DEMO_TARGETS_CONFIRMED }}
  DEMO_ROLLBACK_EVIDENCE_URL: ${{ vars.DEMO_ROLLBACK_EVIDENCE_URL }}
  DEMO_EXPIRES_AT: ${{ vars.DEMO_EXPIRES_AT }}

concurrency:
  # Serialize all MAIN modes; do not cancel an in-flight paired deployment.
  group: sudoku-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Unit, PostgreSQL, frontend build and proxy regressions
        run: sh scripts/test.sh

  publish:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ghcr.io/sadevaraj/simple-sudoku-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sadevaraj/aidevtools_prj
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: frontend
          push: true
          tags: ghcr.io/sadevaraj/simple-sudoku-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sadevaraj/aidevtools_prj
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image pair (including partial publication)
        if: always()
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          RENDER_DEV_CD_ENABLED: ${{ vars.RENDER_DEV_CD_ENABLED }}
          RENDER_DEV_VERIFIED: ${{ vars.RENDER_DEV_VERIFIED }}
        run: python3 scripts/pipeline.py record-pair
      - name: Retain immutable image identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-pair-${{ github.sha }}
          path: image-pair.json
          if-no-files-found: error
          retention-days: 30

  deploy-development:
    needs: [tests, publish]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      github.ref == 'refs/heads/main' &&
      vars.RENDER_DEV_CD_ENABLED == 'true' &&
      vars.RENDER_DEV_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: sudoku-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Deploy exact published development pair
        env:
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
          RENDER_DEV_CD_ENABLED: ${{ vars.RENDER_DEV_CD_ENABLED }}
          RENDER_DEV_VERIFIED: ${{ vars.RENDER_DEV_VERIFIED }}
          RENDER_DEV_VERIFICATION_URL: ${{ vars.RENDER_DEV_VERIFICATION_URL }}
          RENDER_DEV_BACKEND_SERVICE_ID: ${{ vars.RENDER_DEV_BACKEND_SERVICE_ID }}
          RENDER_DEV_FRONTEND_SERVICE_ID: ${{ vars.RENDER_DEV_FRONTEND_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/pipeline.py deploy
      - name: Retain deployment result, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-development-${{ github.sha }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 30

  authorize-fault:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'fault' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      github.ref == 'refs/heads/main' && github.actor == 'sadevaraj' &&
      vars.DEMO_FAULT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require immutable owner trusted SHA before checkout
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["TRUSTED_REVISION"])'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner prerequisites and exact fault delta
        run: >-
          python3 scripts/demo_control.py verify-candidate
          --trusted-revision "$TRUSTED_REVISION" --fault-revision "$FAULT_REVISION"

  reproduce-fault:
    needs: authorize-fault
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          persist-credentials: false
          path: tooling
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: candidate
      - name: Prove healthy trusted revision with the ordinary full suite
        working-directory: tooling
        run: sh scripts/test.sh
      - name: Use only the authorized faulty source with trusted tooling
        run: cp candidate/backend/app/main.py tooling/backend/app/main.py
      - name: Reproduce authenticated 500 and prove database rollback on disposable PostgreSQL
        working-directory: tooling
        run: |
          docker compose -p sudoku-demo-fault-${{ github.run_id }} -f compose.test.yaml run --build --rm api_tests sh -c 'python -m app.migrate && pytest -q tests/test_api.py::test_deliberate_save_typo_reproduces_500_and_repaired_save_persists'
      - name: Remove disposable database and containers
        if: always()
        working-directory: tooling
        run: docker compose -p sudoku-demo-fault-${{ github.run_id }} -f compose.test.yaml down --volumes --remove-orphans

  build-fault-images:
    needs: [authorize-fault, reproduce-fault]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build unprivileged backend image archive
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          outputs: type=docker,dest=/tmp/sudoku-demo-backend.tar
          tags: localhost/simple-sudoku-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sadevaraj/aidevtools_prj
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build unprivileged frontend image archive
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: frontend
          push: false
          outputs: type=docker,dest=/tmp/sudoku-demo-frontend.tar
          tags: localhost/simple-sudoku-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sadevaraj/aidevtools_prj
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sudoku-fault-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/sudoku-demo-backend.tar
            /tmp/sudoku-demo-frontend.tar
          if-no-files-found: error
          retention-days: 1

  publish-fault-images:
    needs: [authorize-fault, build-fault-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sudoku-development
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.publish.outputs.backend_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-fault-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fault-images
      - name: Revalidate MAIN, exact delta and window before publication credentials
        run: >-
          python3 scripts/demo_control.py verify-candidate
          --trusted-revision "$TRUSTED_REVISION" --fault-revision "$FAULT_REVISION"
      - name: Authenticate registry publisher
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only prebuilt artifact images and record immutable digests
        id: publish
        env:
          DEMO_FAULT_REVISION: ${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/fault-images/sudoku-demo-backend.tar"
          docker load --input "$RUNNER_TEMP/fault-images/sudoku-demo-frontend.tar"
          python3 scripts/demo_control.py publish-pair

  deploy-fault-pair:
    needs: [authorize-fault, publish-fault-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: sudoku-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact built fault pair to one durable server authorization
        env:
          BACKEND_DIGEST: ${{ needs.publish-fault-images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish-fault-images.outputs.frontend_digest }}
          DEMO_ROLLBACK_BACKEND_DIGEST: ${{ vars.DEMO_ROLLBACK_BACKEND_DIGEST }}
          DEMO_ROLLBACK_FRONTEND_DIGEST: ${{ vars.DEMO_ROLLBACK_FRONTEND_DIGEST }}
          DEMO_CONTROL_TOKEN: ${{ secrets.DEMO_CONTROL_TOKEN }}
        run: python3 scripts/demo_control.py arm-demo
      - name: Deploy exact fault image pair to fixed Sudoku development services
        env:
          BACKEND_DIGEST: ${{ needs.publish-fault-images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish-fault-images.outputs.frontend_digest }}
          DEMO_FAULT_DEPLOY_APPROVED: ${{ vars.DEMO_FAULT_DEPLOY_APPROVED }}
          DEMO_ROLLBACK_BACKEND_DIGEST: ${{ vars.DEMO_ROLLBACK_BACKEND_DIGEST }}
          DEMO_ROLLBACK_FRONTEND_DIGEST: ${{ vars.DEMO_ROLLBACK_FRONTEND_DIGEST }}
          RENDER_DEV_VERIFICATION_URL: ${{ vars.RENDER_DEV_VERIFICATION_URL }}
          RENDER_DEV_BACKEND_SERVICE_ID: ${{ vars.RENDER_DEV_BACKEND_SERVICE_ID }}
          RENDER_DEV_FRONTEND_SERVICE_ID: ${{ vars.RENDER_DEV_FRONTEND_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 scripts/demo_control.py verify-candidate \
            --trusted-revision "$TRUSTED_REVISION" --fault-revision "$FAULT_REVISION"
          python3 scripts/pipeline.py demo-deploy
      - name: Retain fault deployment result, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-fault-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 30

  authorization:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'repair' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      github.ref == 'refs/heads/main' && vars.ALERT_REPAIR_ENABLED == 'true' &&
      vars.DEMO_CONTROL_ENABLED == 'true'
    outputs:
      run_id: ${{ steps.claim.outputs.run_id }}
      run_attempt: ${{ steps.claim.outputs.run_attempt }}
      incident_id: ${{ steps.claim.outputs.incident_id }}
      expires_at: ${{ steps.claim.outputs.expires_at }}
      branch: ${{ steps.claim.outputs.branch }}
      trusted_revision: ${{ steps.claim.outputs.trusted_revision }}
      fault_revision: ${{ steps.claim.outputs.fault_revision }}
      expected_repaired_tree: ${{ steps.claim.outputs.expected_repaired_tree }}
      backend_digest: ${{ steps.claim.outputs.backend_digest }}
      frontend_digest: ${{ steps.claim.outputs.frontend_digest }}
      rollback_backend_digest: ${{ steps.claim.outputs.rollback_backend_digest }}
      rollback_frontend_digest: ${{ steps.claim.outputs.rollback_frontend_digest }}
      backend_target: ${{ steps.claim.outputs.backend_target }}
      frontend_target: ${{ steps.claim.outputs.frontend_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require immutable owner trusted SHA before checkout
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["TRUSTED_REVISION"])'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ vars.DEMO_TRUSTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted scripts and workflow to the exact faulty MAIN
        run: >-
          python3 scripts/demo_control.py verify-runtime
          --trusted-revision "$TRUSTED_REVISION" --fault-revision "$FAULT_REVISION"
      - name: Claim receiver-accepted incident before candidate execution
        id: claim
        env:
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_AUTH_URL: ${{ vars.ALERT_REPAIR_AUTH_URL }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED: ${{ vars.REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py authorize
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"

      - name: Require server authorization to match the pinned workflow pair
        env:
          CLAIM_TRUSTED: ${{ steps.claim.outputs.trusted_revision }}
          CLAIM_FAULT: ${{ steps.claim.outputs.fault_revision }}
        run: |
          test "$CLAIM_TRUSTED" = "$TRUSTED_REVISION"
          test "$CLAIM_FAULT" = "$FAULT_REVISION"

  candidate:
    needs: authorization
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'repair' &&
      github.repository == 'sadevaraj/aidevtools_prj' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.trusted_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.fault_revision }}
          path: candidate
          persist-credentials: false
      - name: Build pinned isolated Copilot runtime from trusted tooling
        run: docker build -f scripts/repair-runtime.Dockerfile -t sudoku-repair-runtime:trusted .
      - name: Run existing coordinator in bounded candidate workspace
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
          ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
          ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
          ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
          ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
          ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
          ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED: ${{ vars.REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py run
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
          --patch "$RUNNER_TEMP/candidate.patch"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sudoku-repair-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.patch
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [authorization, candidate]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'repair' &&
      github.repository == 'sadevaraj/aidevtools_prj' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: tooling
    env:
      REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED: ${{ vars.REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED }}
      DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
      ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
      ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
      ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
      ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
      ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
      ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
      ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
      ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.trusted_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.fault_revision }}
          path: candidate
          persist-credentials: false
      - name: Verify the one-time receiver claim before patch validation
        env:
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
          ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
          ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
          ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
          ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
          ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
          ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py verify-authorization
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-repair-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-candidate
      - name: Validate and apply candidate patch
        run: >-
          python3 scripts/repair_runner.py apply-patch
          "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
      - name: Run trusted full suite on exact repaired candidate tree
        run: >-
          python3 scripts/repair_runner.py test-candidate
          --candidate-root "$GITHUB_WORKSPACE/candidate"
          --patch "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --output "$RUNNER_TEMP/test-receipt.json"
      - name: Build pinned isolated Copilot runtime for independent role reviews
        run: docker build -f scripts/repair-runtime.Dockerfile -t sudoku-repair-runtime:trusted .
      - name: Produce independent diff-bound QA and Reviewer evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
        run: |
          python3 scripts/repair_runner.py collect-reviews \
            --patch "$RUNNER_TEMP/repair-candidate/candidate.patch" \
            --fault-revision "$ALERT_REPAIR_AUTH_FAULT_REVISION" \
            --test-receipt "$RUNNER_TEMP/test-receipt.json" \
            --output "$RUNNER_TEMP/repair-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sudoku-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-evidence.json
          if-no-files-found: error
          retention-days: 1

  publish-pr:
    needs: [authorization, verify]
    defaults:
      run:
        working-directory: tooling
    env:
      REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED: ${{ vars.REPAIR_UNVERIFIED_ACCESS_ONE_ATTEMPT_APPROVED }}
      DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
      ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
      ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
      ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
      ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
      ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
      ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
      ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
      ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
      ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'repair' &&
      github.repository == 'sadevaraj/aidevtools_prj' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.authorization.outputs.trusted_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Verify receiver authorization before publication credentials
        env:
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py verify-authorization
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-repair-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-candidate
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sudoku-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-evidence
      - name: Verify independent current-candidate evidence before PR credentials
        env:
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
        run: >-
          python3 scripts/repair_runner.py verify-evidence
          --patch "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --evidence "$RUNNER_TEMP/repair-evidence/repair-evidence.json"
          --fault-revision "$ALERT_REPAIR_AUTH_FAULT_REVISION"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.ALERT_REPAIR_PR_TOKEN }}
          ref: ${{ needs.authorization.outputs.branch }}
          path: publish
          persist-credentials: true
      - name: Publish only the validated and independently tested patch
        env:
          ALERT_REPAIR_PR_TOKEN: ${{ secrets.ALERT_REPAIR_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_INCIDENT_ID: ${{ inputs.incident_id }}
          ALERT_EXPIRES_AT: ${{ inputs.expires_at }}
          ALERT_REPAIR_AUTHORIZED: ${{ needs.authorization.result == 'success' }}
          ALERT_REPAIR_AUTH_RUN_ID: ${{ needs.authorization.outputs.run_id }}
          ALERT_REPAIR_AUTH_RUN_ATTEMPT: ${{ needs.authorization.outputs.run_attempt }}
          ALERT_REPAIR_AUTH_INCIDENT_ID: ${{ needs.authorization.outputs.incident_id }}
          ALERT_REPAIR_AUTH_EXPIRES_AT: ${{ needs.authorization.outputs.expires_at }}
          ALERT_REPAIR_ENABLED: ${{ vars.ALERT_REPAIR_ENABLED }}
          DEMO_CONTROL_ENABLED: ${{ vars.DEMO_CONTROL_ENABLED }}
          ALERT_REPAIR_AUTH_BRANCH: ${{ needs.authorization.outputs.branch }}
          ALERT_REPAIR_AUTH_TRUSTED_REVISION: ${{ needs.authorization.outputs.trusted_revision }}
          ALERT_REPAIR_AUTH_FAULT_REVISION: ${{ needs.authorization.outputs.fault_revision }}
          ALERT_REPAIR_AUTH_EXPECTED_REPAIRED_TREE: ${{ needs.authorization.outputs.expected_repaired_tree }}
          ALERT_REPAIR_AUTH_BACKEND_DIGEST: ${{ needs.authorization.outputs.backend_digest }}
          ALERT_REPAIR_AUTH_FRONTEND_DIGEST: ${{ needs.authorization.outputs.frontend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_BACKEND_DIGEST: ${{ needs.authorization.outputs.rollback_backend_digest }}
          ALERT_REPAIR_AUTH_ROLLBACK_FRONTEND_DIGEST: ${{ needs.authorization.outputs.rollback_frontend_digest }}
          ALERT_REPAIR_AUTH_BACKEND_TARGET: ${{ needs.authorization.outputs.backend_target }}
          ALERT_REPAIR_AUTH_FRONTEND_TARGET: ${{ needs.authorization.outputs.frontend_target }}
          REPAIR_COPILOT_OWNER_ENABLED: ${{ vars.REPAIR_COPILOT_OWNER_ENABLED }}
          REPAIR_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.REPAIR_FREE_ENTITLEMENT_CONFIRMED }}
          REPAIR_QUOTA_CONFIRMED: ${{ vars.REPAIR_QUOTA_CONFIRMED }}
          REPAIR_NO_OVERAGE_CONFIRMED: ${{ vars.REPAIR_NO_OVERAGE_CONFIRMED }}
          REPAIR_PROVIDER_TRANSMISSION_APPROVED: ${{ vars.REPAIR_PROVIDER_TRANSMISSION_APPROVED }}
        run: >-
          python3 scripts/repair_runner.py publish-pr
          --incident-id "$ALERT_INCIDENT_ID"
          --expires-at "$ALERT_EXPIRES_AT"
          --patch "$RUNNER_TEMP/repair-candidate/candidate.patch"
          --candidate-root "$GITHUB_WORKSPACE/publish"
          --evidence "$RUNNER_TEMP/repair-evidence/repair-evidence.json"
